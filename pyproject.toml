[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-evolution-routing"
version = "0.1.0"
description = "A plugin-oriented framework for adaptive agent evolution experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
aer = "experiments.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aer_core*", "plugins*", "experiments*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"plugins.benchmarks.toy_tasks" = ["*.json"]
"plugins.benchmarks.hard_local" = ["*.json"]
