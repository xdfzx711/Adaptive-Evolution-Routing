[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-evolution-routing"
version = "0.1.0"
description = "A plugin-oriented framework for adaptive agent evolution experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
    "mcp>=1.30,<2",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
gepa = ["gepa==0.1.4"]
oscopilot = ["jupyter-client>=8.6,<9", "ipykernel>=6.29,<7"]
skillclaw-baseline = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "openai>=1.50,<3"]
hotpotqa-data = ["pyarrow>=18"]

[project.scripts]
aer = "experiments.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aer_core*", "plugins*", "experiments*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"plugins.benchmarks.toy_tasks" = ["*.json"]
"plugins.benchmarks.hard_local" = ["*.json"]
"experiments" = ["data/*.json", "configs/*.yaml", "skills/*/SKILL.md"]
"plugins.evaluators.hotpotqa_official" = ["LICENSE.txt", "PROVENANCE.json"]
