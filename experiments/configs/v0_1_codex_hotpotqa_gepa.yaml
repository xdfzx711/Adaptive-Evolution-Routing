# Fixed-Prompt baseline. Prepare local data using experiments.prepare_hotpotqa.
schema_version: aer.v0.1
experiment:
  id: hotpotqa-fixed-gepa
  seed: 42
  runner: aer
benchmark:
  plugin: hotpotqa_adapter
  execution_split: dev
  task_ids: null
  config:
    manifest_path: ../data/hotpotqa_manifest.json
state:
  task_mode: independent
agent:
  plugin: codex_cli_agent
  initial_prompt: >-
    Answer the question using the supplied paragraphs. Return only a JSON object
    containing a concise answer and supporting_facts as [title, sentence_id] pairs.
    Use the original document titles and zero-based sentence IDs. Use only supplied
    context; do not browse, run shell commands, or read other files.
  initial_snapshot_ref: null
  config:
    windows_sandbox: mxc
    initial_model: gpt-6.1-sol
    allowed_models: [gpt-6.1-sol]
    timeout_seconds: 180.0
    skills: null
    memory: null
    workspace:
      plugin: empty_workspace
    collector:
      plugin: json_result_collector
providers:
  model:
    plugin: qwen_model
    model_id: ${QWEN_MODEL}
    config:
      dotenv_path: ../../.env
      api_key_env: QWEN_API_KEY
      base_url_env: QWEN_BASE_URL
      temperature: 0.0
      enable_thinking: false
      send_seed: false
      response_format: null
  tools:
    plugin: deterministic_tools
    enabled: []
assessment:
  evaluator: hotpotqa_evaluator
  evaluator_config:
    primary_metric: joint_f1
  diagnoser: llm_diagnoser
evolution:
  mode: fixed
  max_candidates_per_round: 1
  stop_on_success: false
routing:
  plugin: fixed_router
  fixed_target: prompt
  manual_decisions: []
targets:
  allowed: [prompt]
  default_operators:
    prompt: gepa_prompt_evolver
  operator_configs:
    prompt:
      max_metric_calls: 9
      samples_per_evaluation: 3
      max_iterations: 2
      reflection_minibatch_size: 1
      use_merge: false
      deduplicate_prompts: true
      skip_perfect_score: false
      timeout_seconds: 900.0
      reflection_timeout_seconds: 90.0
      trial_timeout_seconds: 180.0
      trial_evaluator: null
      reflection_model:
        plugin: qwen_model
        model_id: ${QWEN_MODEL}
        config:
          dotenv_path: ../../.env
          api_key_env: QWEN_API_KEY
          base_url_env: QWEN_BASE_URL
          temperature: 0.0
          enable_thinking: false
          send_seed: false
          response_format: null
validation:
  plugin: paired_validation
  split: validation
  group_field: validation_group
  similar_group: similar
  regression_group: regression
  acceptance_policy: weighted_improvement
  policy_version: v0.1
  weights:
    current_task: 0.5
    similar: 0.25
    regression: 0.25
  min_improvement: 0.01
  max_regression_drop: 0.0
feedback:
  policy: dev_feedback_and_validation_summary
limits:
  max_evolution_rounds: 1
  # Global cumulative budgets remain unenforced; inner GEPA call/time limits apply.
  max_tokens: 120000
  max_tool_calls: 100
  max_elapsed_seconds: 1800.0
  model_call_timeout_seconds: 90.0
  tool_call_timeout_seconds: 5.0
  max_output_tokens_per_call: 4096
  max_consecutive_no_commit_rounds: null
storage:
  root: ../../runs
  experience: jsonl
  artifacts: local_files
  versions: local_manifest
