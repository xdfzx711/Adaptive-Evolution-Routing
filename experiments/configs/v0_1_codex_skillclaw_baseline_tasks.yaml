# AER only supplies task execution and external scoring to the baseline runner.
schema_version: aer.v0.1
experiment:
  id: skillclaw-native-baseline
  seed: 42
  runner: aer
benchmark:
  plugin: hard_local
  execution_split: dev
  task_ids: [hard-dev-001, hard-dev-002, hard-dev-003]
state:
  task_mode: independent
agent:
  plugin: codex_cli_agent
  initial_prompt: Complete the public task using tools when useful. Return only a JSON object matching the public output requirements.
  initial_snapshot_ref: null
  config:
    windows_sandbox: mxc
    initial_model: gpt-6.1-sol
    allowed_models: [gpt-6.1-sol]
    ignore_user_config: true
    timeout_seconds: 300.0
    skills: null
providers:
  model:
    plugin: scripted_model
    model_id: scripted-v0.1
    config:
      scenario_id: mvp_v0_1_contract
  tools:
    plugin: deterministic_tools
    enabled: []
assessment:
  evaluator: deterministic_evaluator
  diagnoser: lightweight_diagnoser
evolution:
  mode: disabled
  max_candidates_per_round: 1
routing:
  plugin: null
  fixed_target: null
  manual_decisions: []
targets:
  allowed: []
  default_operators: {}
validation:
  plugin: paired_validation
  split: validation
  group_field: validation_group
  similar_group: similar
  regression_group: regression
  acceptance_policy: improvement_with_regression_guard
  policy_version: v0.1
  min_improvement: 0.01
  max_regression_drop: 0.0
feedback:
  policy: dev_feedback_and_validation_summary
limits:
  max_evolution_rounds: 0
  max_tokens: 120000
  max_tool_calls: 100
  max_elapsed_seconds: 900.0
  model_call_timeout_seconds: 60.0
  tool_call_timeout_seconds: 5.0
  max_output_tokens_per_call: 4096
  max_consecutive_no_commit_rounds: null
storage:
  root: ../../runs
  experience: jsonl
  artifacts: local_files
  versions: local_manifest
